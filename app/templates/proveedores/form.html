{% extends "base.html" %}

{% block title %}{{ modo }} proveedor | Intermediación{% endblock %}
{% block page_title %}{{ modo }} proveedor{% endblock %}

{% block content %}
<form class="form-card" method="post">
    <div class="form-grid">
        <label>
            Nombre
            <input name="nombre" value="{{ proveedor.nombre or '' }}" required maxlength="160">
        </label>
        <label>
            NIT
            <input name="nit" value="{{ proveedor.nit or '' }}" maxlength="40">
        </label>
        <label>
            Contacto
            <input name="contacto" value="{{ proveedor.contacto or '' }}" maxlength="120">
        </label>
        <label>
            Teléfono
            <input name="telefono" value="{{ proveedor.telefono or '' }}" maxlength="60">
        </label>
        <label>
            Correo
            <input type="email" name="email" value="{{ proveedor.email or '' }}" maxlength="160">
        </label>
        <label>
            Ciudad
            <input name="ciudad" value="{{ proveedor.ciudad or '' }}" maxlength="100">
        </label>
        <label class="span-2">
            Notas
            <textarea name="notas" rows="4">{{ proveedor.notas or '' }}</textarea>
        </label>
    </div>
    <div class="form-actions">
        <a class="icon-button" href="{{ url_for('main.dashboard') }}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 11 9-8 9 8"></path>
                <path d="M5 10v10h14V10"></path>
                <path d="M9 20v-6h6v6"></path>
            </svg>
            <span>Menú</span>
        </a>
        <a href="{{ url_for('main.proveedores') }}">Cancelar</a>
        <button class="icon-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
                <path d="M17 21v-8H7v8"></path>
                <path d="M7 3v5h8"></path>
            </svg>
            <span>Guardar</span>
        </button>
    </div>
</form>
{% endblock %}
