<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Intermediación{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">I</span>
                <div>
                    <strong>Intermediación</strong>
                    <small>Gestión comercial</small>
                </div>
            </div>
            <nav class="nav-list" aria-label="Principal">
                {% set endpoint = request.endpoint or '' %}
                <a class="nav-item {{ 'active' if endpoint == 'main.dashboard' else '' }}" href="{{ url_for('main.dashboard') }}">Dashboard</a>
                <a class="nav-item {{ 'active' if endpoint.startswith('main.producto') or endpoint in ['main.productos', 'main.unidades', 'main.presentaciones', 'main.lotes'] else '' }}" href="{{ url_for('main.productos') }}">Productos</a>
                <a class="nav-item {{ 'active' if endpoint.startswith('main.cliente') else '' }}" href="{{ url_for('main.clientes') }}">Clientes</a>
                <a class="nav-item {{ 'active' if endpoint.startswith('main.proveedor') else '' }}" href="{{ url_for('main.proveedores') }}">Proveedores</a>
                <a class="nav-item {{ 'active' if endpoint.startswith('main.compra') or endpoint == 'main.compras' else '' }}" href="{{ url_for('main.compras') }}">Compras</a>
                <a class="nav-item" href="#">Ventas</a>
                <a class="nav-item {{ 'active' if endpoint.startswith('main.inventario') else '' }}" href="{{ url_for('main.inventario_movimientos') }}">Inventario</a>
                <a class="nav-item" href="#">Cartera</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Panel gerencial</p>
                    <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                <a class="user-chip icon-button" href="{{ url_for('main.login') }}">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <path d="M10 17l5-5-5-5"></path>
                        <path d="M15 12H3"></path>
                    </svg>
                    <span>Ingresar</span>
                </a>
            </header>

            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        document.addEventListener("submit", (event) => {
            const form = event.target.closest("form[data-confirm]");
            if (!form) {
                return;
            }
            if (!window.confirm(form.dataset.confirm)) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
