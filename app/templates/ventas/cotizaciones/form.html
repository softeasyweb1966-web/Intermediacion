{% extends "base.html" %}
{% block title %}Nueva cotización de venta | Intermediacion{% endblock %}
{% block page_title %}Nueva cotización de venta{% endblock %}
{% block content %}
<section class="toolbar"><a class="secondary-action icon-button" href="{{ url_for('main.venta_cotizaciones') }}"><span>Regresar</span></a><button class="primary-action icon-button" type="submit" form="venta-cotizacion-form">Guardar</button></section>
<form id="venta-cotizacion-form" class="form-card wide-form" method="post"><div class="form-grid"><label>Cliente<select name="cliente_id" required><option value="">Seleccione</option>{% for cliente in clientes %}<option value="{{ cliente.id }}">{{ cliente.nombre }}</option>{% endfor %}</select></label><label>Vigencia<input type="date" name="vigencia_hasta"></label><label class="span-2">Observaciones<textarea name="observaciones" rows="2"></textarea></label></div><h2 class="subsection-title">Productos</h2><div class="line-table-wrap"><table class="line-table"><thead><tr><th>Producto</th><th>Presentación</th><th>Cantidad</th><th>Precio</th></tr></thead><tbody>{% for i in range(1,9) %}<tr><td><select name="producto_id_{{ i }}"><option value="">Producto</option>{% for producto in productos %}<option value="{{ producto.id }}">{{ producto.nombre }}</option>{% endfor %}</select></td><td><select name="presentacion_id_{{ i }}"><option value="">Sin presentación</option>{% for p in presentaciones %}<option value="{{ p.id }}">{{ p.producto.nombre }} - {{ p.nombre }}</option>{% endfor %}</select></td><td><input type="number" step="0.0001" min="0" name="cantidad_{{ i }}"></td><td><input type="number" step="0.01" min="0" name="precio_{{ i }}"></td></tr>{% endfor %}</tbody></table></div></form>
{% endblock %}
