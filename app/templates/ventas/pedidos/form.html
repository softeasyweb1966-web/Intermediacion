{% extends "base.html" %}{% block title %}Nuevo pedido de venta | Intermediacion{% endblock %}{% block page_title %}Nuevo pedido de venta{% endblock %}{% block content %}<section class="toolbar"><a class="secondary-action icon-button" href="{{ url_for('main.venta_pedidos') }}">Regresar</a><button class="primary-action icon-button" type="submit" form="pedido-form">Guardar</button></section><form id="pedido-form" class="form-card wide-form" method="post"><div class="form-grid"><label>Cliente<select name="cliente_id" required><option value="">Seleccione</option>{% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></label></div><h2 class="subsection-title">Productos</h2><div class="line-table-wrap"><table class="line-table"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th></tr></thead><tbody>{% for i in range(1,9) %}<tr><td><select name="producto_id_{{ i }}"><option value="">Producto</option>{% for p in productos %}<option value="{{ p.id }}">{{ p.nombre }}</option>{% endfor %}</select></td><td><input type="number" step="0.0001" min="0" name="cantidad_{{ i }}"></td><td><input type="number" step="0.01" min="0" name="precio_{{ i }}"></td></tr>{% endfor %}</tbody></table></div></form>{% endblock %}
