{% extends "base.html" %}{% block title %}Nuevo despacho | Intermediacion{% endblock %}{% block page_title %}Nuevo despacho de venta{% endblock %}{% block content %}<section class="toolbar"><a class="secondary-action icon-button" href="{{ url_for('main.venta_despachos') }}">Regresar</a><button class="primary-action icon-button" type="submit" form="despacho-form">Registrar despacho</button></section><form id="despacho-form" class="form-card wide-form" method="post"><div class="form-grid"><label>Cliente<select name="cliente_id" required><option value="">Seleccione</option>{% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></label></div><h2 class="subsection-title">Inventario disponible</h2><div class="line-table-wrap"><table class="line-table"><thead><tr><th>Lote</th><th>Producto</th><th>Disponible</th><th>Cantidad</th></tr></thead><tbody>{% for i in range(1,9) %}<tr><td><select name="lote_id_{{ i }}"><option value="">Lote</option>{% for lote in lotes %}<option value="{{ lote.id }}">{{ lote.numero_lote }} - {{ lote.producto.nombre }}</option>{% endfor %}</select></td><td>-</td><td>-</td><td><input type="number" step="0.0001" min="0" name="cantidad_{{ i }}"></td></tr>{% endfor %}</tbody></table></div></form>{% endblock %}
